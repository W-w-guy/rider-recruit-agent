# 契约要求：docker compose up 一键启动，PG16+pgvector + Redis 7.2
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rider
      POSTGRES_PASSWORD: rider_dev_pw
      POSTGRES_DB: rider
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rider -d rider"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7.2
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rider:rider_dev_pw@db:5432/rider
      REDIS_URL: redis://cache:6379/0
      POLICY_DIR: policy
      API_PORT: ${API_PORT:-8080}
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    restart: unless-stopped

volumes:
  pgdata:
